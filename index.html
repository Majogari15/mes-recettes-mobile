<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes Recettes</title>
<meta name="description" content="Recettes, courses et planning de repas — sur votre téléphone">
<meta name="theme-color" content="#2F5233">
<link rel="icon" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes Recettes">
<!--
  Politique de sécurité du contenu : limite les origines autorisées à
  charger des scripts ou à recevoir des connexions réseau, réduisant le
  risque qu'un contenu importé et mal filtré puisse exécuter du code
  arbitraire. "unsafe-inline" reste nécessaire pour les styles (l'app
  utilise beaucoup de style="" en ligne, un choix délibéré pour rester
  un simple fichier sans étape de compilation) — mais jamais pour les
  scripts, qui restent strictement limités aux origines listées
  ci-dessous.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'wasm-unsafe-eval';
  worker-src 'self' blob:;
  style-src 'self' 'unsafe-inline';
  font-src 'self';
  img-src 'self' data: https:;
  connect-src 'self' https:;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<script src="sw-register-early.js"></script>
<!--
  Lien manifeste statique, présent dès le HTML brut (utile aux outils
  d'analyse qui ne lisent pas toujours le JavaScript exécuté, comme
  PWABuilder) — pointe par défaut sur le manifeste français. Mis à
  jour par manifest-loader.js ci-dessous si une autre langue est déjà
  enregistrée, en modifiant CE MÊME lien (pas en créant un second),
  pour rester compatible avec les navigateurs qui n'utilisent que le
  premier lien manifeste rencontré.
-->
<link rel="manifest" id="app-manifest" href="manifest.json">
<script src="manifest-loader.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--
  Lien d'évitement ("skip link") : invisible tant qu'il n'a pas le
  focus clavier, premier élément atteignable au clavier/lecteur
  d'écran — permet de sauter directement au contenu de l'écran actuel
  sans devoir retraverser toute la barre supérieure (retour, titre,
  actions) à chaque nouvel écran. Reste HORS de #app (jamais recréé
  par render(), qui vide et reconstruit #app à chaque changement
  d'écran) : son texte est mis à jour depuis i18n.js selon la langue
  choisie (voir CURRENT_LANG/setLang), comme document.title et
  document.documentElement.lang juste au-dessus.
-->
<a href="#main-content" id="skip-link" class="skip-link">Aller au contenu principal</a>
<div id="app"></div>
<noscript>
  <div style="max-width:480px;margin:60px auto;padding:20px;text-align:center;font-family:sans-serif;color:#2B2420;">
    <p><strong>Mes Recettes, Mes Courses</strong> a besoin de JavaScript pour fonctionner.<br>Merci de l'activer dans les réglages de votre navigateur.</p>
    <p style="color:#666;">This app requires JavaScript to run. Please enable it in your browser settings.</p>
  </div>
</noscript>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
